</head><body><main class="wrap">
<section id="intro" class="page active">
<p class="muted">SCENT LAB · SEASON TEST</p><h1>나에게 어울리는 향을 알아가는 시간</h1>

<div class="card" style="margin-top:28px"><h2>기본 정보</h2>
<div class="grid2">
<div class="field"><label>이름</label><input id="name" required placeholder="이름"></div>
<div class="field"><label>생년월일</label><input id="birth" required type="text" maxlength="10" placeholder="YYYY-MM-DD" inputmode="numeric" autocomplete="bday"></div>
<div class="field"><label>연락처</label><input id="phone" required type="tel" maxlength="13" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000"></div>
<div class="field"><label>사는 곳</label><input id="area" required placeholder="구까지만 입력해주세요"></div>
<div class="field"><label>MBTI</label><input id="mbti" required placeholder="예: ENFP"></div>
<div class="field"><label>오늘의 기분</label><input id="mood" required placeholder="오늘 기분을 한마디로"></div>
</div>
<div class="field"><label>좋아하는 일</label><textarea id="like" required rows="2" placeholder="내가 좋아하는 일"></textarea></div>
<button id="startTestBtn" class="primary" type="button">검사 시작하기</button>
</div></section>

<section id="extro" class="page"><h2>1차 검사</h2><p>각 문항에서 나와 더 가까운 표현 하나를 선택해주세요.</p><div class="progress"><i id="p1"></i></div><div id="pairArea"></div><div class="nav"><button class="secondary" onclick="pairPrev()">이전</button></div></section>

<section id="season" class="page"><h2>2차 계절 검사</h2><p class="muted">가장 잘 맞는 것 ○ 하나, 그다음 가까운 것 △ 하나를 선택해주세요. <b>○ = 2점 / △ = 1점</b></p><div class="progress"><i id="p2"></i></div><div id="seasonArea"></div><div class="nav"><button class="secondary" onclick="seasonPrev()">이전</button><button class="primary" onclick="seasonNext()">다음</button></div></section>

<section id="result" class="page"><div id="resultArea"></div></section>
<section id="result2" class="page"><div id="resultArea2"></div></section>
</main>
<script>
function perfumeArtData(season, ext){
 const c={
 '봄':{glass:'#f3d6d4',line:'#b88780',stem:'#80634e',flower:'#edc1b8'},
 '여름':{glass:'#e5ead7',line:'#8b9675',stem:'#70805c',flower:'#eee6bd'},
 '가을':{glass:'#ecd8b5',line:'#aa8a5d',stem:'#81704e',flower:'#d7ad67'},
 '겨울':{glass:'#dce7df',line:'#788979',stem:'#607760',flower:'#a8b7a6'}
 }[season];
 let plant='';

let pi=0, si=0, pairAns=Array(20).fill(null), seasonAns=Array.from({length:20},()=>({o:null,t:null}));

function renderPair(){p1.style.width=((pi+1)/20*100)+'%';pairArea.innerHTML=`<div class="card"><b>${pi+1} / 20</b><div class="pair" style="margin-top:18px">${pairs[pi].map((x,i)=>`<button class="choice ${pairAns[pi]===i?'selected':''}" onclick="selectPair(${i})">${x}</button>`).join('')}</div></div>`}
function selectPair(i){
  pairAns[pi]=i;
  renderPair();
  setTimeout(()=>{ if(pi<19){pi++;renderPair();scrollTo(0,0)} else {scentLabOpenPage('season')} },180);
}
function pairPrev(){if(pi>0){pi--;renderPair()}else go('intro')}
function pairNext(){if(pairAns[pi]===null)return alert('가까운 표현을 선택해주세요.');if(pi<19){pi++;renderPair()}else scentLabOpenPage('season')}
function renderSeason(){p2.style.width=((si+1)/20*100)+'%';seasonArea.innerHTML=`<div class="card"><b>${si+1} / 20</b><div class="quad" style="margin-top:18px">${groups[si].map((x,i)=>`<div class="trait"><div class="traitbox">${x}<div class="marks"><button class="mark ${seasonAns[si].o===i?'on':''}" onclick="pick('o',${i})">○</button><button class="mark ${seasonAns[si].t===i?'on':''}" onclick="pick('t',${i})">△</button></div></div></div>`).join('')}</div></div>`}
function pick(k,i){let a=seasonAns[si]; if(k==='o'){if(a.t===i)a.t=null;a.o=i}else{if(a.o===i)a.o=null;a.t=i}renderSeason()}
function seasonPrev(){if(si>0){si--;renderSeason()}else go('extro')}
function seasonNext(){let a=seasonAns[si];if(a.o===null||a.t===null)return alert('○ 하나와 △ 하나를 선택해주세요.');if(si<19){si++;renderSeason()}else showResult()}

{season:'겨울',plant:'대나무',kw:'신념강함 · 분석적 · 논리적',desc:'배우는 것을 좋아하고 논리적이며 미래지향적인 면이 강합니다. 목표를 향해 곧게 나아가고 외부 환경에 쉽게 흔들리지 않는 힘을 지닌 유형입니다.',nature:'대나무가 곧게 자라듯 자신의 기준과 목표가 분명한 편입니다. 논리적으로 납득되는 것을 중요하게 여기며, 관심 분야에서는 깊이 배우고 스스로 답을 찾아가려 합니다. 외부의 평가보다 자신이 옳다고 판단한 방향을 꾸준히 밀고 나가는 힘이 있습니다.',relation:'사람을 대할 때 감정만으로 판단하기보다 상황과 사실을 먼저 살펴보는 편입니다. 그래서 차분하고 믿음직한 인상을 주지만, 때로는 상대가 원하는 공감이나 정서적인 반응을 놓칠 수 있습니다. 내향 대나무형은 생각을 충분히 정리한 뒤 표현하는 경향이 강하고, 외향 대나무형은 자신의 판단과 아이디어를 보다 적극적으로 제시하는 경향이 있습니다.',strength:'분석력, 학습력, 독립성, 장기적인 시야가 큰 강점입니다. 복잡한 문제를 구조화하고 비효율적인 부분을 찾아 개선하는 상황에서 능력을 발휘하기 좋습니다. 단순히 아는 것에 그치지 않고 실제 결과로 연결하는 경험이 쌓일수록 강점이 더욱 선명해집니다.',caution:'생각과 기준이 분명한 만큼 완벽한 답을 찾느라 실행이 늦어지거나, 다른 사람의 감정과 속도를 답답하게 느낄 수 있습니다. 모든 일을 논리로만 해결하려 하기보다 사람의 마음과 상황의 여백을 함께 보는 연습이 도움이 됩니다.',dev:'봄',top:'레몬 · 베르가못 · 그린',mid:'대나무 · 티',base:'시더우드 · 베티버 · 화이트머스크',name:'CLEAR BAMBOO',img:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQwAAAFgCAYAAABOukeyAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAFiUAABYlAUlSJPAAAP+lSURBVHherP13uGXJcR8I/vKY6583Ve+98t62RXtYogE0Go4AVyJHGlGWGonifvvtiNLMShoS35gdsxJXGpmlJM5IIggSFA1A+Aa60d5Xd3nv3fP+vuuOy/0jIvLkOfdWAzOaqDrvnpM2MjIiMtKrOGxpBQDQ0BoZIPcUst7WV894ChrapKGVsgJKjink87Ldcsl3g0la90wp75Kmxz5K/wyZ5MEuTzdQ6QUlDpsJrtm9iyzkZX1rTeXqylEpq9z2L9OXK9SkpTW0JCKOHKar7vM4MWScNZexC6+uaFnQEOoY0lAMBcUZEz6CKLuZv5S6nUcO/e78pZx5958GVlk0IZ7xVIaEUt8aSuo1I1PsZurEcEjGW4KoTEYfTFChRrZsNq78ogBoBSjCS4ErwNAml2fml14dWAGNl+5N2TRqD08GYmspgrwrZsDULw95VHuGytcXKKDicmdzt15sR5Ulvvm03fL5K8UZEIMYQc9jyXQjV7vM9q8EtH+zkE3VCitoMAgqximHDthfg3hC5+OwItLcZBg3Q2fO2+YHUz6BNC5RnyBTMhM/9U/DUkwpG/GuYqFTRukBWfoqpApRa02CSh8mqHlnxaYBS5gFcnjk3ilNSsv4KsFP8oahoQ3aahNsiiiuAJteNqk5VBYnq9w2WFh2+QG9WDVVYlQs/lAWbTJMJZSjR8VBU3P4NECKtbERRH9ZXqkFwRnZf21tZRdEmz/3Bgl/z2BWghmiEzLpdw40+9pMmA+tAShDRIuAuTDZF/kWwqaQCkH6DYuB0QOHHhQzzgpiVaRuNthlE4a1XFLLwaSsDH6KW54MaPOHGSqbPnmIS1bATfB8cboLDCAtm5E9pmeaJits4y0FTPHLKBjFVpnlT/HEnzLLVW9KD5CUZtJkHwJyT71t6yKFDP55v/zfjIXCroJPlvyW/Z6CMn+6IVMKSVZxOe8JRF8J4bBTNoCyHsDK6l6YpK2S1lzBmYLJpxIM75GUpbnzXjZwgl3Mn/ {season:'봄',plant:'매화',kw:'부지런 · 성실 · 근면 · 끈기 · 인내',desc:'이른 봄 먼저 꽃을 피우는 매화처럼 책임감과 인내를 바탕으로 결과를 만들어가는 유형입니다. 맡은 일을 꾸준히 이어가는 힘이 돋보입니다.',nature:'매화는 아직 추위가 남아 있는 이른 봄에 먼저 꽃을 피웁니다. 매화형 역시 상황이 쉽지 않아도 맡은 일을 참고 이어가며 결과를 만들어내는 힘이 있습니다. 해야 할 일이 정해지면 책임감을 가지고 꾸준히 움직이고, 성실함과 인내를 자신의 중요한 기준으로 삼는 편입니다.',relation:'관계에서도 말보다 행동으로 책임을 보여주는 경우가 많습니다. 약속과 신뢰를 중요하게 생각하며 자신에게 주어진 역할을 쉽게 내려놓지 않습니다. 내향 매화형은 묵묵하게 자신의 몫을 해내며 신뢰를 쌓는 편이고, 외향 매화형은 주변 사람까지 함께 움직이게 하며 목표를 추진하는 힘이 두드러질 수 있습니다.',strength:'꾸준함, 책임감, 실행력, 인내가 가장 큰 강점입니다. 단기간의 재미보다 끝까지 해냈을 때 얻는 결과와 의미를 중요하게 여기는 편입니다. 조직이나 공동체에서 꼭 필요한 결과를 만들어내는 사람으로 성장할 가능성이 큽니다.',caution:'효율과 책임을 지나치게 강조하면 쉬는 것에 죄책감을 느끼거나, 자신의 기준을 다른 사람에게도 기대할 수 있습니다. 해야 하는 일뿐 아니라 하고 싶은 일에도 시간을 내고, 변화가 생겼을 때 기존 방식만 고집하지 않는 유연함이 필요합니다.',dev:'여름',top:'베르가못 · 만다린',mid:'매화 · 피오니',base:'화이트 머스크',name:'BLOOMING AIR',img:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQgAAAFjCAYAAADBxZVmAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAFiUAABYlAUlSJPAAAP+lSURBVHhetP13uCVXdtiH/nZVnXRz6JwjgEbOwGASZjiBnKFIkSONREmfLT1LJmXJlETK79miSI715Pf0/L5nf1awZEuiRMqWPYzDMAmTMAAGOaMBdO5Gd99ON9977j2hwn5/rJ2qzmlgRrbX/erc2mnttdZea+1Qu3apvL+pMaCUsrcAaO2SYEg6peRy3nLohwStS+UqtX0glErrIeXDiA8icIDXSgGT7mKr6Qa8zPTNstwUqvSXpXNzCNttsM0+AEuQWC1aBVvPQB0GPkg2KCVpCsOtqjSMruigyW9DA9WWZWzvB/N9AFTILQdvwouFkICb2NPN5GXhfdtvGJj82umMD//IUJK3JgpCaK1xf8MaVevyRXj9nwNWTX4IsZTgA9T+/zJQWFncDEL5hA1v/w/ndFjssLgBqNLyfqRVIcj7QXV9ENpSulL+CkFrw7+N16btla+/VEQbFDfTuTJ+j/X/QvggQQXwfm0dpoT3Q+0whCFtdjPpvD8MK6XKDgKCfJW8w1mzEBSo1jEY4WEI8+9fzw8LgkWwB3XYW12uZYCKIUSU81QyDMk/CK5yF+OcxIBih/TfHLT+4DwDoIaRO6T+wUwOtPsx4QoR1fQSqCq3w6r6D3f3JediQqqCbLC+MgiGm+W6WfwPB8NL21hD6BAZhVBmx5exIHfVcAVco8mA4GYQeVEEaG6efxBCLbWVmlGj9K6gwuG+G32UoUyHya0wxFghDO+IQoKtgoi39kJw4JyD/NemOpdjADeuvPwGxhMO1z2DgwK0UUGeoH1KoJRCK0xfCrgwNyOuBBadlYMWMstQsn9rDhLjnYMSXKUqTVyJaSNHkzlMH6jX5laqMvUSnQjE6usIcCgU2unWYO/qw4Z7w4rCCsLyF9YfgkIZ/XC/wxROhbiH4THgeLIMmRGTF1uJDqHT8OB7j7B4RSzVvCazUibKUBfwW6rDzBgYcBKeQFWYNQiXPKxVA7DsuFyh8IKyPtqnCxEmrIURW8by5vG6YiWwDeKUwfzXWEEEmXVRQmiFRk {season:'여름',plant:'난초',kw:'낙천적 · 멋쟁이 · 예술적 · 민감함',desc:'난초처럼 유연하고 자연스러우며 미적 감각과 표현력이 돋보입니다. 여유와 긍정적인 에너지로 관계와 일상을 풍성하게 만드는 유형입니다.',nature:'난초형은 정해진 틀에 자신을 억지로 맞추기보다 자연스럽고 자유롭게 자신의 방향을 찾아가는 편입니다. 아름다움과 분위기, 감각적인 요소를 잘 느끼며 새로운 경험과 재미에서 에너지를 얻습니다. 현재를 즐기고 상황에 유연하게 대처하는 능력이 돋보입니다.',relation:'사람들과 자연스럽게 어울리고 분위기를 부드럽게 만드는 힘이 있습니다. 외향 난초형은 활기와 표현력이 두드러져 새로운 관계를 빠르게 만드는 편이고, 내향 난초형은 조용하지만 섬세한 감각과 자신만의 취향으로 존재감을 드러내는 편입니다.',strength:'유연함, 표현력, 감각, 낙천성이 강점입니다. 예상하지 못한 상황에서도 새로운 방법을 찾거나 분위기를 전환하는 데 능할 수 있습니다. 자신의 감각을 창작, 표현, 관계 형성에 연결하면 강점이 더욱 살아납니다.',caution:'재미와 현재의 만족을 우선하다 보면 장기적인 계획이나 꾸준함이 부족해질 수 있습니다. 하고 싶은 것을 충분히 즐기되, 중요한 목표에는 일정한 기준과 루틴을 만들어 지속하는 힘을 기르는 것이 좋습니다.',dev:'가을',top:'베르가못 · 네롤리 · 아쿠아',mid:'오키드 · 자스민',base:'화이트머스크 · 샌달우드',name:'ORCHID BREEZE',img:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQUAAAFcCAYAAADBF6uuAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAFiUAABYlAUlSJPAAAP+lSURBVHhetP3pkyVHkuAH/szd3xVHRkRmRt4X8sR9FgoooO6zu7qq+poZzvQse0S4Ilyh7P4D5MxwmpSV/UIRCmWFlOWucIccyuz0zHD6qKPrRqEKBRRuIAEk8gLyvjPjjni3u9t+UDVzc38vE1VLWc2M99zM1NRU1dTU1MzN/Zm037EAxgCAfglYsFhfYKvlGEEKoUAvl5QqGowFsNgg3wRIFhTHFQonLs8C1lqMY7wKRsp9wn26DwtGaQJgRTptxeeZUBBDoaiK2ADGmKDNcVDWirU2yCpa9jJZC0Z5CsmW9FJOWxFMirS+5Dt6DtMAxotDpY1QjFIVLbQ+HfZaAVJf9acY1lqiEKlidE53VjN8/weGUFVvqG+jGgywS7xZa5VbxRjXX44lawq+SggFD0ZtzMk4QosywyU9GeWzUsdxV8JVlHCsjAMnuZMSJ7O3Ab32Xe0uinKAyHjZKwKNke+3gnGKHBHGlYYFxfVI0wGa9eWjyvRXd2vPa2qc0iXHgHRUSF4yi/QIg3eDu/FYgUqBt5OA33Hg9RDUD8zB59lysgBfb7RwxNeGaRM6E5dlfNvjxoYDX1QhUK5S0b/L9YKMKfRwrzIHZsQhybXKUJkMq2CC6mDKrqciV3nScm06hxAUVZoqFRlleTw7MJIv3I/XhOSWaSm2ZhSO26rWPTVbKEbLjSvz2QF+yIFxmgtaDnCM//DIGM+C1d5XJo2r7KDaGAUN7+GEuDGaB0UdlQ1TNFOCsFmfFyC5+u7P86u83xMq5aHBVAaakHK+vyiw1vVLhfkS08qPK/JoYvTj53bXZY6Q6E50OqKRgFZg+E6nHqPMpe+JQNCKFEWmyy2Fi3e7rmYp1coAHesI7saDh6rcY0CHgTjGoivG1nQOwSXH4kqO46vKX9iLo3VdBac/KXVjuRjioxIbRTeZLh8kM0AdaUnBtaUIJeJ3q0NQz1AgBhZUZtGlglnfDzyPpCBqcbZbXjKE9It8z6ZV5yAIPrSShHyF8lWXKiFq8PE7g7CsXtdSpuPll49yuOwUWtST5YOWOVpO3V4Gp0t1RErTh5lFEyWJtFaQwwiGRZctPid0QaNRTYma {season:'가을',plant:'국화',kw:'조화 · 자아실현 · 가치추구',desc:'국화처럼 자신의 가치를 중요하게 여기면서도 관계의 조화를 추구합니다. 감정의 깊이와 삶의 의미를 섬세하게 바라보는 유형입니다.',nature:'국화형은 관계의 조화를 중요하게 여기면서 동시에 자신이 중요하게 생각하는 가치와 의미를 찾으려는 경향이 있습니다. 겉으로 드러나는 결과만큼 그 과정에서 어떤 마음을 주고받았는지, 자신다운 선택이었는지를 중요하게 생각합니다.',relation:'다른 사람의 마음과 분위기를 세심하게 살피며 갈등보다는 조화를 만들려고 합니다. 내향 국화형은 깊고 소수의 관계에서 마음을 나누는 편이고, 외향 국화형은 여러 사람 사이에서 공감대를 만들고 관계를 연결하는 역할을 잘할 수 있습니다.',strength:'공감력, 관계 감각, 가치지향성, 섬세함이 큰 강점입니다. 사람의 마음을 이해하고 서로 다른 입장을 조율하는 상황에서 강점을 발휘합니다. 자신이 의미 있다고 느끼는 일을 만났을 때 깊은 몰입과 헌신으로 이어질 수 있습니다.',caution:'다른 사람을 배려하다 자신의 욕구를 뒤로 미루거나, 말과 반응에 영향을 많이 받을 수 있습니다. 관계를 지키는 것과 자신의 기준을 지키는 것 사이의 균형을 배우는 것이 중요합니다. 필요한 순간에는 자신의 생각을 분명하게 표현하는 연습도 도움이 됩니다.',dev:'겨울',top:'만다린 · 피치 · 베르가못',mid:'국화 · 아이리스',base:'엠버 · 샌달우드 · 바닐라',name:'GOLDEN CHRYSANTH',img:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAARQAAAFcCAYAAAAJe0F4AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAFiUAABYlAUlSJPAAAP+lSURBVHherP1ptB3JdZgLfpGZZ7zzANwLXMxAFYACakINrGKRIimKEklJlGXZlmTJTx6ktlt2D3691utebltyr/eWX69+tp/9bLdt2ZI1W7IpWSLFschizVWoAYUCCvN4Md95vmfKzOgfOyIyMs9BFdXd+6xzTkbEjh1779ixY8jISJW0NzQWNKC8awsuTsmlEgSHogRBmQgbb8MAWimXz/wZPLmwdF2WAi+mCLRBUCq7RoFCobUlBFprDLcu3WbUgmAye0S04c3Stiw7zIKANl4LgxmuMpk9fGXxDIbOiDveLS1LwgPllXM/yOmbXjQ8gZz8fl14ya4CMjyNp1PLr0s1cUYPNrf70UVswfDLddde3SqPT12Q3enED2cCoJRQtWrLUA3vLkKhVLf95O3a1qeJU0JHa6M8pTxelfBh0wSzqM5u/l0b8dTlyVO4cHXhaSjXPhyvNtUlmp9cvWey++DTVl3sZPS11sRxTOAbltF/HnKFaFNhBa3YVE+ILJyHriiLpO6Twc+TU5b5LzT6Lig6Ba3zjQlDV9ON3AuKWQ2tLJuvkG58dL7h+24IbCPIQ3eMyC7xRgmogrOx8b0gbxz3h1QY1pmc2jYiA8rqs0sPeaP7SDCV2SV/MWziXKxt9ObXxrvGVtR/V4WYvLq7LqT+TDfSgw1sOcrvCQu498mXQcZx7r+bzZ6QR1NiF0qu7wtdtLsiHBSpZCadpWgFBIogDAksllG/fLWxep+azjRviSqKaOKZcxWjsnw2rwMXUGivtzJR2YVSoCW9aF826Izc/OV6Yw+KUV4n0kWboqoLevcbVjGtIE0Px9MdsqCUwn0yC+lm0DQsp2KLo4xhSYRoQ5ke1gqsbFrXnzMDd20Cyov3pctxVdCDg16idouTSyjKlEPydWHTjUz3q/sic1bHXkQB7ieMl2SKyvFaBFWo03ypWW6T14yTzbX9yLVfN1lL7M1nzj7JyycjMK+de3yLPFleCRsp/brwMJRSqEChkva6Vt6QO6epHBTCXtCqxx+SKp26a6HoD7F8lZk06DFmtyDpykvvUlaRYm6IKxXqg/ZouLQiT <script id="scentlab-final-integration">
(function(){
 const ENDPOINT="https://script.google.com/macros/s/AKfycbyjyNkDTdRwWpz6R1yDT8Er1BN-wnVlUWQjZFnWbmTneUHLes7ggntWW3r3B1xolJKK2Q/exec"; let sent=false;
 const val=id=>String(document.getElementById(id)?.value||'').trim();
 function bf(v){const n=v.replace(/\D/g,'').slice(0,8);return n.length<=4?n:n.length<=6?n.slice(0,4)+'-'+n.slice(4):n.slice(0,4)+'-'+n.slice(4,6)+'-'+n.slice(6);}
 function pf(v){const n=v.replace(/\D/g,'').slice(0,11);return n.length<=3?n:n.length<=7?n.slice(0,3)+'-'+n.slice(3):n.slice(0,3)+'-'+n.slice(3,7)+'-'+n.slice(7);}
 function vb(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const [y,m,d]=v.split('-').map(Number),now=new Date();if(y<1900||y>now.getFullYear()||m<1||m>12||d<1||d>31)return false;if(d>new Date(y,m,0).getDate())return false;const x=new Date(y,m-1,d);x.setHours(0,0,0,0);now.setHours(0,0,0,0);return x<=now;}
 function vp(v){return /^01[016789]-\d{3,4}-\d{4}$/.test(v);}
 window.scentLabOpenPage=function(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));const p=document.getElementById(id);if(p)p.classList.add('active');scrollTo(0,0);if(id==='extro'&&typeof renderPair==='function')renderPair();if(id==='season'&&typeof renderSeason==='function')renderSeason();};
 window.go=id=>scentLabOpenPage(id);
 window.saveScentLabResult=function(fd){
  if(sent||!fd||!fd.d)return;

  const pairAnswers=pairs.map((pair,index)=>({
    left:pair[0],
    right:pair[1],
    selected:pairAns[index]===null?'':pair[pairAns[index]]
  }));

  const seasonAnswers=groups.map((group,index)=>({
    circle:seasonAns[index].o===null?'':group[seasonAns[index].o],
    triangle:seasonAns[index].t===null?'':group[seasonAns[index].t]
  }));

  const seasonScores={
    '겨울':fd.sc?.[0]??0,
    '봄':fd.sc?.[1]??0,
    '여름':fd.sc?.[2]??0,
    '가을':fd.sc?.[3]??0
  };

  sent=true;
  fetch(ENDPOINT,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({
      name:val('name'),
      birth:val('birth'),
      phone:val('phone'),
      area:val('area'),
      mbti:val('mbti'),
      mood:val('mood'),
      like:val('like'),
      extResult:fd.ext||'',
      season:fd.d.season||'',
      seasonScores:seasonScores,
      pairAnswers:pairAnswers,
      seasonAnswers:seasonAnswers
    }),
    keepalive:true
  }).catch(()=>sent=false);
};
 addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('birth'),p=document.getElementById('phone');if(b)b.oninput=()=>b.value=bf(b.value);if(p)p.oninput=()=>p.value=pf(p.value);const old=document.getElementById('startTestBtn');if(!old)return;const btn=old.cloneNode(true);old.parentNode.replaceChild(btn,old);btn.addEventListener('click',e=>{e.preventDefault();for(const id of ['name','birth','phone','area','mbti','mood','like']){const el=document.getElementById(id);if(!el||!String(el.value||'').trim()){alert('기본 정보를 모두 입력해주세요.');el?.focus();return;}}if(!vb(val('birth'))){alert('생년월일을 정확히 입력해주세요.\n월은 01~12, 일은 실제 존재하는 날짜만 입력할 수 있습니다.');b.focus();return;}if(!vp(val('phone'))){alert('연락처를 11자리 휴대폰 번호로 입력해주세요.');p.focus();return;}scentLabOpenPage('extro');});});
})();
</script>
